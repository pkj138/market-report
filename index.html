<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시황 리포트</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; max-width: 680px; margin: 0 auto; padding: 24px 20px 60px; color: #0b0b0b; background: #fcfcfb; line-height: 1.6; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #52514e; font-size: 13.5px; margin-bottom: 24px; }
  .day-group { margin-bottom: 22px; }
  .day-label { font-size: 13px; font-weight: 700; color: #898781; margin-bottom: 8px; letter-spacing: .02em; }
  .day-label.today { color: #184f95; }
  .report-list { display: flex; flex-direction: column; gap: 8px; }
  .report-link { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #e1e0d9; border-radius: 8px; padding: 12px 14px; text-decoration: none; color: #0b0b0b; }
  .report-link:hover { border-color: #2a78d6; }
  .report-link .slot { font-weight: 600; font-size: 14.5px; }
  .report-link .arrow { color: #898781; font-size: 13px; }
  .empty, .loading, .error { color: #898781; font-size: 13.5px; padding: 20px 0; }
  .error { color: #c0392b; }
  .hint { margin-top: 32px; border-top: 1px solid #e1e0d9; padding-top: 16px; font-size: 12.5px; color: #898781; }
</style>
</head>
<body>
<h1>시황 리포트</h1>
<div class="subtitle">매일 07:00 · 12:00 · 18:00(KST) 자동 생성 — 최신순</div>
<div id="content" class="loading">불러오는 중…</div>
<div class="hint">이 페이지를 홈 화면에 추가하거나 북마크해두면 매일 새 리포트가 자동으로 위에 표시됩니다.</div>

<script>
const SLOT_LABEL = { "0700": "🌅 아침 (07:00)", "1200": "☀️ 정오 (12:00)", "1800": "🌆 마감 (18:00)" };

function dayLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00+09:00");
  const now = new Date();
  const kstNow = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
  const todayStr = kstNow.toISOString().slice(0, 10);
  const dow = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
  const label = `${dateStr} (${dow})`;
  return dateStr === todayStr ? { text: label + " · 오늘", isToday: true } : { text: label, isToday: false };
}

fetch("https://api.github.com/repos/pkj138/market-report/contents/reports")
  .then(r => {
    if (!r.ok) throw new Error("목록을 불러오지 못했습니다 (" + r.status + ")");
    return r.json();
  })
  .then(files => {
    const reports = files
      .map(f => f.name)
      .filter(n => /^\d{4}-\d{2}-\d{2}-\d{4}\.html$/.test(n))
      .map(n => {
        const m = n.match(/^(\d{4}-\d{2}-\d{2})-(\d{4})\.html$/);
        return { name: n, date: m[1], slot: m[2] };
      })
      .sort((a, b) => (a.date + a.slot < b.date + b.slot ? 1 : -1));

    const el = document.getElementById("content");
    if (reports.length === 0) {
      el.className = "empty";
      el.textContent = "아직 생성된 리포트가 없습니다.";
      return;
    }

    const byDate = {};
    for (const r of reports) {
      (byDate[r.date] = byDate[r.date] || []).push(r);
    }

    el.className = "";
    el.innerHTML = "";
    for (const date of Object.keys(byDate).sort().reverse()) {
      const { text, isToday } = dayLabel(date);
      const group = document.createElement("div");
      group.className = "day-group";
      const label = document.createElement("div");
      label.className = "day-label" + (isToday ? " today" : "");
      label.textContent = text;
      group.appendChild(label);

      const list = document.createElement("div");
      list.className = "report-list";
      for (const r of byDate[date].sort((a, b) => (a.slot < b.slot ? 1 : -1))) {
        const a = document.createElement("a");
        a.className = "report-link";
        a.href = "reports/" + r.name;
        a.innerHTML = `<span class="slot">${SLOT_LABEL[r.slot] || r.slot}</span><span class="arrow">보기 →</span>`;
        list.appendChild(a);
      }
      group.appendChild(list);
      el.appendChild(group);
    }
  })
  .catch(err => {
    const el = document.getElementById("content");
    el.className = "error";
    el.textContent = "오류: " + err.message;
  });
</script>
</body>
</html>
